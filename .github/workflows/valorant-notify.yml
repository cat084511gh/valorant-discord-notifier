name: Valorant 試合通知

on:
  schedule:
    # 10 分おき (UTC)。GitHub の混雑で数分〜十数分遅れることがあります
    - cron: "*/10 * * * *"
  workflow_dispatch: # Actions 画面から手動実行もできる
    inputs:
      test:
        description: "テスト送信 (最新の 1 試合を必ず通知する)"
        type: boolean
        default: false

permissions:
  contents: write # state/last_match.json をコミットするため

concurrency:
  group: valorant-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 新しい試合をチェックして通知
        env:
          HENRIK_API_KEY: ${{ secrets.HENRIK_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VAL_NAME: 年上お姉さんに依存されたい
          VAL_TAG: blitz
          VAL_REGION: ap
          TEST_NOTIFY: ${{ inputs.test && '1' || '' }}
        run: python valorant_notify.py

      - name: 状態ファイルを保存
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "Update last match id"
            git push
          fi
